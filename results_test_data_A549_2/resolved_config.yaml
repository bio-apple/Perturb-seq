input:
  barcode_policy: strict
  input_dir: /Users/yfan/Desktop/test_data
  guide_separator: '|'
labels:
  feature_type_crispr: CRISPR Direct Capture
  feature_type_gex: Gene Expression
  multi_guide_policy: drop
  targets_per_cell: 1
  nt_control: Non-Targeting_Control
qc:
  min_genes: 200.0
  max_genes: 6000.0
  max_mito_frac: 0.2
  min_cells_per_target: 20
  min_cells_per_guide: 10
  min_guide_umi: null
  mito_gene_prefix: MT-
preprocess:
  normalize_target_sum: 10000
  n_hvg: 2000
  n_pcs: 30
  n_neighbors: 15
  leiden_resolution: 0.5
  cell_type_key: null
  batch_key: null
mixscape:
  enabled: true
  min_de_genes: 5
  logfc_threshold: 0.1
  pval_cutoff: 0.05
  max_de_genes: 100
  n_dims: 30
  n_control_neighbors: 20
  iter_num: 10
mixscale:
  min_de_genes: 5
  logfc_threshold: 0.1
  pval_cutoff: 0.05
  max_de_genes: 100
statistics:
  mode: descriptive
  aggregation:
  - target
  - guide
  pseudocount_cpm: 1.0
  bootstrap_n: 200
  bootstrap_ci: 0.95
  min_nt_cells: 20
  fdr_threshold: 0.05
  allow_random_split_replicates: false
perturb:
  mixscape_min_de_genes: 5
  mixscape_logfc: 0.1
  mixscape_pval: 0.05
  cell_type_key: null
edistance:
  n_perms: 1000
  padj_threshold: 0.0015
  max_contrast_cells: 4000
target_expression:
  min_nt_detection_fraction: 0.05
  min_nt_mean_cpm: 1.0
  direction_log2fc_tolerance: 0.1
singler:
  enabled: true
plotting:
  formats:
  - png
  mixscape_heatmap_max_genes: 20
  mixscape_heatmap_max_cells: 300
  dpi: 300
  width: 8
  height: 6
  theme: white
  hist_bins: 50
  markers: null
  max_legend_categories: 20
  scatter_max_points: 50000
  volcano_lfc: 1.0
  heatmap_max_genes: 50
  save_plot_data: false
  palette:
    nt: '#7F7F7F'
    targeting: '#1F77B4'
    single_targeting: '#1F77B4'
    single_nt: '#7F7F7F'
    low_cells_target: '#FF7F0E'
    qc_failed: '#D62728'
    multi_guide: '#9467BD'
    no_guide: '#BDBDBD'
    retained: '#2CA02C'
run:
  random_seed: 0
runtime:
  seed: 0
  n_threads: 3
experiment:
  sample_id: A549_2
  organism: human
  crispr_mode: CRISPR_KO
  crispr_mode_description: null
  expected_target_direction: null
  resolved_expected_direction: not_required
  biological_sample_count: 1
  resolved_organism: human
  resolved_mito_prefix: MT-
  organism_evidence:
  - 输入物种 human
  - 线粒体前缀 MT-
  - 基因号 ENSG 62700 个，例如 ENSG00000290825.1、ENSG00000223972.6、ENSG00000227232.5
  - 基因号 ENSMUSG 0 个
  - 基因符号 MT- 37 个，例如 MT-TF、MT-RNR1、MT-TV
  - 基因符号 mt- 0 个
  other_organelle_prefixes: []
  species_check: passed
output:
  output_dir: /Users/yfan/Desktop/bio-apple/Perturb-seq/results_test_data_A549_2
control:
  control_source: designed_nt
  control_label: Non-Targeting_Control
  temporary: false
  control_phrase: Non-Targeting_Control
  note: ''
  fallback_from: ''
