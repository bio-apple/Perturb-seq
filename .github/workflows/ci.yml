name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.9,<0.12" "mypy>=1.8,<2" "pandas-stubs>=2.1" "types-PyYAML>=6.0"

      - name: Ruff check
        # Check only (no --fix / no format --check) to avoid mass-reformat CI failures.
        run: ruff check src tests

      - name: Mypy (core APIs)
        run: >
          python -m mypy
          src/perturbseq/qc.py
          src/perturbseq/perturbation.py
          src/perturbseq/statistics.py
          src/perturbseq/_deps.py

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev extras, no pertpy)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Run pytest
        run: |
          # Default job: fast synthetic/demo tests only. pertpy-marked tests
          # skip via importorskip when pertpy is absent.
          pytest -q --ignore=results
