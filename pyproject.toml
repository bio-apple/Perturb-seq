[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbseq"
version = "0.1.0"
description = "Tertiary Perturb-seq analysis from DRAGEN scRNA CRISPR outputs, using pertpy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scanpy>=1.10",
  "scipy>=1.11",
  "seaborn>=0.13",
]

[project.optional-dependencies]
pertpy = ["pertpy>=1.3"]
de = ["pertpy[de]>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
perturbseq-tertiary = "perturbseq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
