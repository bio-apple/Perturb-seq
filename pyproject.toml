[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbseq"
version = "1.0.0"
description = "Single-sample Perturb-seq tertiary analysis for DRAGEN CRISPR outputs."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
perturbseq-tertiary = "perturbseq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
