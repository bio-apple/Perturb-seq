[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbseq"
version = "1.0.0"
description = "Single-sample Perturb-seq tertiary analysis for DRAGEN CRISPR outputs."
requires-python = ">=3.11"
dependencies = [
    "adjustText>=1.0",
    "anndata>=0.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pertpy>=1.3",
    "pydeseq2>=0.5",
    "PyYAML>=6",
    "scanpy>=1.10",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
enrichment = ["gseapy>=1.1"]
dev = ["ruff>=0.9"]

[project.scripts]
perturbseq-tertiary = "perturbseq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
