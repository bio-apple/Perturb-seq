# 分析软件默认参数。样本、物种、输入输出目录、guide 分隔符、非靶向对照和 CRISPR 模式由命令行传入。
# 本文件里的样本名、路径和 QC 绝对阈值会被命令行覆盖。
input:
  barcode_policy: strict
labels:
  feature_type_crispr: CRISPR Direct Capture
  feature_type_gex: Gene Expression
  multi_guide_policy: drop
  # 下游分析只保留恰好这么多条 guide 的细胞。默认 1。
  guides_per_cell: 1
qc:
  min_genes: 200
  max_genes: 6000
  max_mito_frac: 0.2
  min_cells_per_target: 20
  min_cells_per_guide: 10

preprocess:
  normalize_target_sum: 10000
  # PCA / neighbors / Leiden / UMAP 建立在 top n_hvg 高变基因上；文库归一化仍用全部基因。
  n_hvg: 2000
  n_pcs: 40
  n_neighbors: 15
  leiden_resolution: 1.0
mixscape:
  enabled: true
  min_de_genes: 5
  # RunMixscape / MixscapeHeatmap 的 logfc.threshold。教程调用没有改写，函数默认 0.25。
  logfc_threshold: 0.2
  pval_cutoff: 0.05
  max_de_genes: 100
  # CalcPerturbSig：ndims=40，num.neighbors=20。矩阵比 40 小时才截断。
  n_dims: 40
  n_control_neighbors: 20
  # RunMixscape iter.num。
  iter_num: 10
# RunMixscale 教程实参：https://satijalab.github.io/Mixscale/
# min.de.genes = 5，logfc.threshold = 0.2，max.de.genes = 100，fine.mode = F。
# pval.cutoff 教程调用没有写，函数默认是 0.05。不读取 mixscape.logfc_threshold。
mixscale:
  min_de_genes: 5
  logfc_threshold: 0.2
  pval_cutoff: 0.05
  max_de_genes: 100
statistics:
  mode: descriptive
  aggregation:
    - target
    - guide
  pseudocount_cpm: 1.0
  # 样本内重抽样次数。百分位区间表示描述性 log2FC 的不确定性。
  bootstrap_n: 200
  # 百分位区间的水平，取 (0, 1) 内的数。
  bootstrap_ci: 0.95
  min_nt_cells: 20
  fdr_threshold: 0.05
  allow_random_split_replicates: false
perturb:
  distance_metric: edistance
  mixscape_min_de_genes: 5
  # Mixscape 的回退 logfc，与 mixscape.logfc_threshold 一致。Mixscale 不读这个键。
  mixscape_logfc: 0.25
  mixscape_pval: 0.05
target_expression:
  min_nt_detection_fraction: 0.05
  min_nt_mean_cpm: 1.0
  direction_log2fc_tolerance: 0.1
augur:
  classifier: random_forest
  n_folds: 5
  n_subsamples: 3
  subsample_size: 20
  n_estimators: 80
  feature_perc: 0.5
  n_threads: 4
  branch: main
enrichment:
  enabled: true
  database: GO_Biological_Process_2023
  gene_sets: GO_Biological_Process_2023
  min_genes: 10
  max_targets: 40
# 簇注释调用 Rscript 里的 SingleR 与 celldex。false 时跳过，不要求安装 R。
singler:
  enabled: true
plotting:
  formats:
    - png
  mixscape_heatmap_max_genes: 20
  mixscape_heatmap_max_cells: 300
  dpi: 300
  width: 8
  height: 6
  theme: whitegrid
  top_n_guides: 20
  max_legend_categories: 20
  scatter_max_points: 50000
  volcano_lfc: 1.0
  heatmap_max_genes: 50
  enrichment_top_n: 15
  save_plot_data: true
  palette:
    nt: '#7F7F7F'
    targeting: '#1F77B4'
    single_targeting: '#1F77B4'
    single_nt: '#7F7F7F'
    low_cells_target: '#FF7F0E'
    qc_failed: '#D62728'
    multi_guide: '#9467BD'
    no_guide: '#BDBDBD'
    retained: '#2CA02C'
run:
  random_seed: 0
runtime:
  seed: 0
