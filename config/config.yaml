# 分析软件默认参数。样本、物种（--organism → experiment.organism）、输入输出目录、
# guide 分隔符、非靶向对照和 CRISPR 模式（--crispr-mode：KO / i / a / other → experiment.crispr_mode）由命令行传入。
# 本文件里的样本名、路径和 QC 绝对阈值会被命令行覆盖。
input:
  barcode_policy: strict
labels:
  feature_type_crispr: CRISPR Direct Capture
  feature_type_gex: Gene Expression
  multi_guide_policy: drop
  # 下游分析只保留恰好这么多个唯一靶基因的细胞。默认 1。
  # 同一靶基因的多条 guide（如双 guide 文库）仍算单靶，不进 multi_guide。
  targets_per_cell: 1
qc:
  # 表达基因数：剔除 n_genes ≤ min_genes 或 n_genes ≥ max_genes。
  # 线粒体：剔除 mito_frac ≥ max_mito_frac（0.2 = 20%）。
  # UMI：须同时给出 min_umi / max_umi（命令行或本文件），否则不做 UMI 绝对阈值过滤。
  # 核糖体：须显式给出 max_ribo_frac，否则不做 ribo 过滤。不再使用 MAD。
  min_genes: 200
  max_genes: 6000
  max_mito_frac: 0.2
  min_cells_per_target: 20
  min_cells_per_guide: 10
  min_guide_umi: null

preprocess:
  normalize_target_sum: 10000
  # PCA / neighbors / Leiden / UMAP 建立在 top n_hvg 高变基因上；文库归一化仍用全部基因。
  n_hvg: 2000
  # 与 mixscape.n_dims 保持一致（默认 30；见 config.DEFAULT_EMBEDDING_NDIMS）。
  n_pcs: 30
  n_neighbors: 15
  leiden_resolution: 0.5
mixscape:
  enabled: true
  min_de_genes: 5
  # RunMixscape / MixscapeHeatmap 的 logfc.threshold。Seurat 函数默认 0.25（不是 Mixscale 的 0.2）。
  logfc_threshold: 0.25
  pval_cutoff: 0.05
  max_de_genes: 100
  # CalcPerturbSig 维数；与 preprocess.n_pcs 一致（本流水线 30；Seurat vignette 曾用 40）。
  # num.neighbors=20。矩阵比请求维数小时才截断。
  n_dims: 30
  n_control_neighbors: 20
  # RunMixscape iter.num。
  iter_num: 10
# RunMixscale 教程实参：https://satijalab.github.io/Mixscale/
# min.de.genes = 5，logfc.threshold = 0.2，max.de.genes = 100，fine.mode = F。
# pval.cutoff 教程调用没有写，函数默认是 0.05。不读取 mixscape.logfc_threshold。
mixscale:
  min_de_genes: 5
  logfc_threshold: 0.2
  pval_cutoff: 0.05
  max_de_genes: 100
statistics:
  mode: descriptive
  aggregation:
    - target
    - guide
  pseudocount_cpm: 1.0
  # 样本内重抽样次数。百分位区间表示描述性 log2FC 的不确定性。
  bootstrap_n: 200
  # 百分位区间的水平，取 (0, 1) 内的数。
  bootstrap_ci: 0.95
  min_nt_cells: 20
  # descriptive 模式下不用于效应表；保留键以免旧配置报未知键。更换后端前不要解读为组间 FDR。
  fdr_threshold: 0.05
  allow_random_split_replicates: false
perturb:
  distance_metric: edistance
  mixscape_min_de_genes: 5
  # 仅当 mixscape.logfc_threshold 缺省时回退；须与上面 Mixscape 门槛一致。Mixscale 不读此键。
  mixscape_logfc: 0.25
  mixscape_pval: 0.05
target_expression:
  min_nt_detection_fraction: 0.05
  min_nt_mean_cpm: 1.0
  direction_log2fc_tolerance: 0.1
# 簇注释调用 Rscript 里的 SingleR 与 celldex。false 时跳过，不要求安装 R。
singler:
  enabled: true
plotting:
  formats:
    - png
  mixscape_heatmap_max_genes: 20
  mixscape_heatmap_max_cells: 300
  dpi: 300
  width: 8
  height: 6
  theme: whitegrid
  max_legend_categories: 20
  scatter_max_points: 50000
  volcano_lfc: 1.0
  heatmap_max_genes: 50
  save_plot_data: true
  palette:
    nt: '#7F7F7F'
    targeting: '#1F77B4'
    single_targeting: '#1F77B4'
    single_nt: '#7F7F7F'
    low_cells_target: '#FF7F0E'
    qc_failed: '#D62728'
    multi_guide: '#9467BD'
    no_guide: '#BDBDBD'
    retained: '#2CA02C'
run:
  random_seed: 0
runtime:
  seed: 0
