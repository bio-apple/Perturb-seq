# 分析软件默认参数。
# 步骤：io → assign → preprocess → mixscape ‖ mixscale。
# 图目录：Mixscape/、mixscale/、qc/、UMAP/。成功结束后磁盘只保留 PNG。
# 参考：pertpy Mixscape / Mixscale；Seurat Mixscape vignette；satijalab Mixscale。
# 样本、物种（--organism → experiment.organism）、输入输出目录、guide 分隔符、
# 非靶向对照（--nt-control）和 CRISPR 模式（--crispr-mode：KO / i / a）由命令行传入。
# --nt-control 默认 NEG_CONTROL/Non-Targeting/NegCtrl：在 feature_barcode_reference 的
# id/name/target_gene_name/target_gene_id 上精确匹配（忽略大小写）；可自定义；均未匹配则自动 zero_guide。
# 也可 --nt-control zero_guide。匹配到但无可用 NT 细胞时 assign 回退临时 zero_guide。
# 本文件里的样本名、路径和 QC 绝对阈值会被命令行覆盖。
# 图只写 PNG（dpi 见 plotting.dpi）；plotting.formats 可存在，实现固定写 PNG。
input:
  barcode_policy: strict
labels:
  feature_type_crispr: CRISPR Direct Capture
  feature_type_gex: Gene Expression
  multi_guide_policy: drop
  # 下游分析只保留恰好这么多个唯一靶基因的细胞。默认 1。
  # 同一靶基因的多条 guide（如双 guide 文库）仍算单靶，不进 multi_guide。
  targets_per_cell: 1
qc:
  # QC 过滤：n_genes（nFeature）、mito_frac（percent.mt）。
  # nCount（total_counts）只计算并画在 QC 图上，不做文库 UMI 绝对阈值过滤。
  # 表达基因数：剔除 n_genes ≤ min_genes 或 n_genes ≥ max_genes。
  # 线粒体：剔除 mito_frac ≥ max_mito_frac（0.2 = 20%）。
  min_genes: 200
  max_genes: 6000
  max_mito_frac: 0.2
  min_cells_per_target: 20
  min_cells_per_guide: 10

preprocess:
  normalize_target_sum: 10000
  # PCA / neighbors / Leiden / UMAP 建立在 top n_hvg 高变基因上；文库归一化仍用全部基因。
  n_hvg: 2000
  # 与 mixscape.n_dims 保持一致（默认 30；见 config.DEFAULT_EMBEDDING_NDIMS）。
  n_pcs: 30
  n_neighbors: 15
  leiden_resolution: 0.5
mixscape:
  enabled: true
  min_de_genes: 5
  # DE 门槛 |logFC|≥0.1（与 mixscale.logfc_threshold / perturb.mixscape_logfc 一致）。
  logfc_threshold: 0.1
  pval_cutoff: 0.05
  max_de_genes: 100
  # CalcPerturbSig 维数；与 preprocess.n_pcs 一致（默认 30）。
  # num.neighbors=20。矩阵比请求维数小时才截断。
  n_dims: 30
  n_control_neighbors: 20
  # RunMixscape iter.num。
  iter_num: 10
# Mixscale DE 门槛：https://satijalab.github.io/Mixscale/
# |logFC|≥0.1；min_de_genes=5；max_de_genes=100；fine_mode=false；pval_cutoff=0.05。
# 不读取 mixscape.logfc_threshold。
mixscale:
  min_de_genes: 5
  logfc_threshold: 0.1
  pval_cutoff: 0.05
  max_de_genes: 100
perturb:
  mixscape_min_de_genes: 5
  # 仅当 mixscape.logfc_threshold 缺省时回退；须与上面 Mixscape 门槛一致（0.1）。Mixscale 不读此键。
  mixscape_logfc: 0.1
  mixscape_pval: 0.05
# 簇注释：SingleR（R / celldex；enabled:false 跳过）与 ScType（仅 CLI：--sctype-tissue 等）。
singler:
  enabled: true
plotting:
  # 实现只写 PNG；formats 键可存在（默认 [png]），不切换格式。
  # 图风格对齐 Library-D（白底、浅灰网格、全边框、navy 直方图）。
  formats:
    - png
  mixscape_heatmap_max_genes: 20
  mixscape_heatmap_max_cells: 300
  dpi: 300
  width: 8
  height: 6
  theme: white
  hist_bins: 50
  # GEX marker 热图/点图基因列表；null 则用人/鼠默认 housekeeping（见 config.DEFAULT_MARKERS_BY_ORGANISM）。
  markers: null
  max_legend_categories: 20
  scatter_max_points: 50000
  heatmap_max_genes: 50
  # false：不写图旁 plot_data/*.tsv；流水线结束还会清理非 PNG 产物。
  save_plot_data: false
  palette:
    nt: '#7F7F7F'
    targeting: '#1F77B4'
    single_targeting: '#1F77B4'
    single_nt: '#7F7F7F'
    low_cells_target: '#FF7F0E'
    qc_failed: '#D62728'
    multi_guide: '#9467BD'
    no_guide: '#BDBDBD'
    retained: '#2CA02C'
run:
  random_seed: 0
runtime:
  seed: 0
  # 默认 max(1, CPU数//3)；控制 OpenMP/BLAS/scanpy.n_jobs 与并行步 ProcessPool 上限。
  # n_threads: 4
