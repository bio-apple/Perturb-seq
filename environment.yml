# Default conda env: core scientific stack from conda-forge + editable
# install with pertpy[de] (Mixscape / E-distance / PyDESeq2).
#
#   conda env create -f environment.yml
#   conda activate perturbseq-tertiary
#
# Lightweight / core-only (no pertpy): see README → pip install -e .
name: perturbseq-tertiary
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # Core runtime (compatible ranges; align with pyproject.toml / constraints.txt)
  - numpy>=1.26,<3
  - pandas>=2.1,<3
  - scipy>=1.11,<2
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<0.15
  - pyyaml>=6.0,<7
  - joblib>=1.3,<2
  - anndata>=0.10,<0.14
  - scanpy>=1.10,<2
  - leidenalg>=0.10,<0.12
  - python-igraph>=0.11,<0.12
  - pip:
      - -c constraints.txt
      - -e ".[de,dev]"
